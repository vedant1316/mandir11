# Mandir 11 — Ranking & Stats Configuration
#
# This file controls all scoring weights and thresholds for the Stats Engine.
# Edit this file to tune ranking behaviour — never hardcode weights in stats_engine.py.
# Phase 4 implementation will read this file at startup.

overall_ranking:
  win_weight: 3
  loss_weight: 0
  participation_weight: 0.1

streak_reset_on: loss   # options: "loss" | "loss_or_no_result"

cricket_stats:
  qualifying_innings_for_average: 1
  qualifying_overs_for_economy: 2
